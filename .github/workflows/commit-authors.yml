name: Commit authors

# Fails when any commit was authored, committed or co-authored by anyone
# other than the emails allowed below. Make this check required on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-authors:
    name: Commit authors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check authors, committers and co-authors
        env:
          # Emails allowed as author, committer or co-author (space separated).
          AUTHORS: "113312948+MikkelTonatiuh@users.noreply.github.com"
          # Extra emails allowed only as committer (GitHub's web editor and merge button).
          COMMITTERS: "noreply@github.com"
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          authors=" ${AUTHORS,,} "
          committers=" ${AUTHORS,,} ${COMMITTERS,,} "
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            commits=$(git rev-list "$HEAD")
          else
            commits=$(git rev-list "$BASE..$HEAD")
          fi
          fail=0
          for c in $commits; do
            author=$(git log -1 --format=%ae "$c"); author=${author,,}
            committer=$(git log -1 --format=%ce "$c"); committer=${committer,,}
            case "$authors" in *" $author "*) ;; *)
              echo "::error::$c is authored by $author"; fail=1 ;; esac
            case "$committers" in *" $committer "*) ;; *)
              echo "::error::$c is committed by $committer"; fail=1 ;; esac
            co_authors=$(git log -1 --format=%B "$c" | grep -i '^co-authored-by:' | grep -o '<[^>]*>' | tr -d '<>' || true)
            for co in $co_authors; do
              case "$authors" in *" ${co,,} "*) ;; *)
                echo "::error::$c lists co-author $co"; fail=1 ;; esac
            done
          done
          [ "$fail" = 0 ] && echo "All commits are by allowed authors."
          exit $fail
