<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./voice/engine.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html, body { margin: 0; padding: 0; background: #090b0d; }
  a { color: #c9d0d8; text-underline-offset: 3px; }
  a:hover { color: #e8eef4; }
</style>
</helmet>

<div style="min-height: 100vh; background: #090b0d; color: #c9d0d8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 20px 48px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; box-sizing: border-box">

  <sc-if value="{{ notHome }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ goHome }}" style="position: fixed; top: 18px; left: 20px; margin: 0; z-index: 2; border: 0; background: none; color: #8b939c; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">home</button>
  </sc-if>

  <button type="button" onClick="{{ onBlop }}" aria-label="{{ aria }}" style="width: min(380px, 86vw); height: auto; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center">
    <span ref="{{ rideRef }}" style="width: 100%; will-change: transform">
      <canvas ref="{{ blopRef }}" width="380" height="380" role="img" aria-label="Blop" style="width: min(380px, 86vw); height: min(380px, 86vw); display: block; cursor: pointer"></canvas>
    </span>
  </button>

  <sc-if value="{{ isBoard }}" hint-placeholder-val="{{ false }}">
    <div style="width: min(22rem, 86vw); display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; text-align: center; font-size: 34px; font-weight: 500; letter-spacing: -0.03em; color: #e8eef4">{{ score }}</p>
      <sc-if value="{{ hasOverlay }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px">
          <canvas ref="{{ overlayRef }}" width="704" height="112" role="img" aria-label="Your melody against the example's" style="width: 100%; height: 56px; display: block"></canvas>
          <span style="font-size: 11px; letter-spacing: 0.04em; color: #5c636c; text-align: center">dashed: the example · solid: you</span>
        </div>
      </sc-if>
      <sc-for list="{{ bars }}" as="bar" hint-placeholder-count="3">
        <div style="display: grid; grid-template-columns: 7.2rem 1fr 2rem; gap: 10px; align-items: center; font-size: 13px; letter-spacing: 0.04em; color: #7b838e">
          <span>{{ bar.name }}</span>
          <span style="display: block; height: 3px; background: #1b2026">
            <i style="display: block; height: 100%; background: #c5ced8; width: {{ bar.width }}"></i>
          </span>
          <span>{{ bar.value }}</span>
        </div>
      </sc-for>
      <p style="margin: 0; max-width: 28rem; text-align: center; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.35; color: #e8eef4; text-wrap: pretty">{{ boardCopy }}</p>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin-top: 4px">
        <sc-if value="{{ hasExample }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ hearExample }}" style="border: 0; background: none; color: #8b939c; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">hear the example</button>
        </sc-if>
        <sc-if value="{{ hasTake }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ hearTake }}" style="border: 0; background: none; color: #8b939c; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">hear yourself</button>
        </sc-if>
        <button type="button" onClick="{{ newLine }}" style="border: 0; background: none; color: #8b939c; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">new line</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isRec }}" hint-placeholder-val="{{ false }}">
    <div role="button" tabindex="0" aria-label="Double tap for another prompt" onPointerDown="{{ onSkipPointer }}" style="display: flex; flex-direction: column; align-items: center; max-width: 28rem; cursor: pointer; user-select: none; -webkit-user-select: none">
      <span style="display: block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.55; margin-bottom: 6px">{{ toneCue }}</span>
      <span ref="{{ capRef }}" style="margin: 0; max-width: 28rem; text-align: center; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.35; color: #e8eef4; text-wrap: pretty">{{ caption }}</span>
      <sc-if value="{{ showGuide }}" hint-placeholder-val="{{ false }}">
        <canvas ref="{{ guideRef }}" width="560" height="88" role="img" aria-label="The example's melody" style="width: min(280px, 70vw); height: 44px; margin-top: 14px; display: block"></canvas>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ isPlain }}" hint-placeholder-val="{{ true }}">
    <span ref="{{ capRef }}" style="margin: 0; max-width: 28rem; text-align: center; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.35; color: #e8eef4; text-wrap: pretty">{{ caption }}</span>
  </sc-if>

  <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ false }}">
    <p style="margin: 0; font-size: 13px; letter-spacing: 0.04em; color: #7b838e">{{ sub }}</p>
  </sc-if>

  <sc-if value="{{ canHear }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; gap: 18px; justify-content: center">
      <button type="button" onClick="{{ hearExample }}" style="border: 0; background: none; color: #8b939c; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">hear it again</button>
      <sc-if value="{{ canShowMelody }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ showMelody }}" style="border: 0; background: none; color: #8b939c; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">show the melody</button>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ isMicErr }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ enterSimulate }}" style="margin-top: 8px; border: 0; background: none; color: #8b939c; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">Continue without a microphone</button>
  </sc-if>

  <sc-if value="{{ hasVoices }}" hint-placeholder-val="{{ false }}">
    <a href="https://github.com/CheyneyComputerScience/CREMA-D" target="_blank" rel="noopener" title="Example voices from CREMA-D (Cao et al., 2014), Open Database License" style="position: fixed; bottom: 18px; left: 20px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5c636c; text-decoration: none" style-hover="color: #e8eef4">voices: crema-d</a>
  </sc-if>

  <a href="index.html" style="position: fixed; bottom: 18px; right: 20px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5c636c; text-decoration: none" style-hover="color: #e8eef4">cv</a>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;takeSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:5,&quot;max&quot;:60,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  get DUR() { return this.props.takeSeconds ?? 20; }
  /* practice lines come from voice/models/lines.json: Blop says each one first from voice/models/<id>.mp3,
     then it's the user's turn. These are the fallback if that file can't be loaded (no example voices) */
  PROMPTS = [
    { t: "Explain meditation techniques for a beginner.", e: "calm" },
    { t: "Describe a peaceful morning routine.", e: "calm" },
    { t: "Rally a team before a big challenge.", e: "excited" },
    { t: "Pitch a revolutionary app idea to investors.", e: "authoritative" },
    { t: "Tell a story about an unexpected adventure.", e: "excited" },
    { t: "Make the case for lifelong learning.", e: "authoritative" },
  ];
  GUIDE_TRIES = 2;   /* the example's melody shows for the first two tries of a line, then fades out */

  state = {
    view: "home",
    prompt: { t: "Explain meditation techniques for a beginner.", e: "calm" },
    recording: false,
    left: 20,
    results: null,
    simulated: false,
    errorCopy: "No sound came through",
    errRetry: false,
    intro: true,
    ready: false,
    speaking: false,
    tries: {},
    showMelody: false,
  };

  /* live values the shader reads every frame — kept off React state on purpose */
  voice = 0;
  tone = 0.4;
  recRef = false;
  arming = false;
  stopping = false;
  discard = false;
  gen = 0;
  reqId = 0;
  t0 = 0;
  raf = 0;
  lastTap = 0;
  lastSkip = 0;
  SKIP_MS = 420;
  simulate = false;
  mods = null;
  handle = null;
  local = null;
  examples = {};
  heard = {};
  exampleAudio = null;
  playCtx = null;
  sayRaf = 0;
  lastTake = null;
  guide = null;
  overlay = null;

  pick() { return this.PROMPTS[Math.floor(Math.random() * this.PROMPTS.length)]; }

  async componentDidMount() {
    const [line, grade, map, pose, local, lines] = await Promise.all([
      import("./blop/line.js"),
      import("./blop/grade.js"),
      import("./blop/map.js"),
      import("./blop/pose.js"),
      import("./blop/local.js"),
      fetch("./voice/models/lines.json").then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
    this.mods = { line, grade, map, pose };
    this.local = local;
    const usable = Array.isArray(lines) ? lines.filter((l) => l && l.id && l.t && l.e) : [];
    if (usable.length) this.PROMPTS = usable;
    let intro = true;
    try { intro = !window.localStorage.getItem("blop-met"); } catch {}
    const first = this.pick();
    this.setState({ ready: true, prompt: first, intro });
    this.exampleFor(first).catch(() => undefined);
    if (intro) {
      this.introTimer = setTimeout(() => {
        try { window.localStorage.setItem("blop-met", "1"); } catch {}
        this.setState({ intro: false });
      }, 2400);
    }
    if (this.blop) {
      const { mountBlop } = await import("./blop/mount.js");
      this.handle = mountBlop(this.blop, () => {
        const s = this.state;
        const board = s.view === "good" || s.view === "unsure";
        const drive = board && this.mods ? this.mods.map.fromAnalyzer(s.results, s.prompt.e) : null;
        return {
          mood: drive ? drive.mood : s.speaking ? "listen" : this.mods ? this.mods.pose.mascotMood(s.view, s.results, s.recording) : "idle",
          voice: this.voice,
          tone: this.tone,
          recording: s.recording,
          band: drive ? drive.band : this.mods ? this.mods.grade.scoreBand(s.view, s.results) : null,
          target: s.prompt.e,
          baseLine: this.caption(),
          allowAsides: s.view === "home",
          ride: this.ride,
          cap: this.cap,
          page: [0.035, 0.04, 0.048],
        };
      });
    }
  }

  componentWillUnmount() {
    clearTimeout(this.introTimer);
    if (this.handle) this.handle.stop();
    this.stopExample();
    this.stopHardware();
  }

  caption() {
    const s = this.state;
    if (!this.mods) return "tap me.";
    return this.mods.line.baseLine({
      view: s.view, recording: s.recording, intro: s.intro,
      prompt: s.prompt, results: s.results, errorCopy: s.errorCopy,
    });
  }

  go(view) { this.setState({ view }); }

  markMet() {
    try { window.localStorage.setItem("blop-met", "1"); } catch {}
    this.setState({ intro: false });
  }

  stopHardware() {
    this.recRef = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }
    if (this.actx) { this.actx.close().catch(() => undefined); this.actx = null; this.an = null; }
    this.voice = 0;
  }

  resetRec() {
    this.discard = true;
    this.arming = false;
    this.stopHardware();
    const rec = this.recorder;
    if (rec && rec.state !== "inactive") { try { rec.stop(); } catch {} }
    this.recorder = null;
    this.chunks = [];
    this.setState({ recording: false, left: this.DUR });
  }

  pickMime() {
    const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
    for (const t of types) if (window.MediaRecorder?.isTypeSupported?.(t)) return t;
    return "";
  }

  loop() {
    if (!this.recRef) return;
    const el = (performance.now() - this.t0) / 1000;
    const remain = Math.max(0, this.DUR - el);
    if (Math.abs(remain - this.state.left) > 0.2) this.setState({ left: remain });
    if (this.an && this.buf) {
      this.an.getByteTimeDomainData(this.buf);
      let sum = 0;
      for (let i = 0; i < this.buf.length; i += 1) { const d = (this.buf[i] - 128) / 128; sum += d * d; }
      this.voice = Math.min(1, Math.sqrt(sum / this.buf.length) * 4);
      if (this.freq) {
        this.an.getByteFrequencyData(this.freq);
        let lo = 0, hi = 0;
        const mid = Math.floor(this.freq.length / 2);
        for (let i = 0; i < mid; i += 1) lo += this.freq[i];
        for (let i = mid; i < this.freq.length; i += 1) hi += this.freq[i];
        this.tone = hi / (lo + hi + 1);
      }
    } else if (this.mods) {
      const target = this.state.prompt.e || "calm";
      this.voice = this.mods.grade.simulatedVoice(el, target);
      this.tone = this.mods.grade.simulatedTone(el, target);
    }
    if (remain <= 0) { this.stopRecording(); return; }
    this.raf = requestAnimationFrame(() => this.loop());
  }

  async startRecording() {
    if (this.recRef || this.arming || this.stopping) return;
    this.stopExample();
    const gen = ++this.gen;
    this.arming = true;
    this.chunks = [];
    this.discard = false;
    if (!this.simulate) {
      try {
        /* automatic gain control would flatten the loudness the analysis measures */
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: false } });
        if (gen !== this.gen) { stream.getTracks().forEach((t) => t.stop()); this.arming = false; return; }
        this.stream = stream;
        const mime = this.pickMime();
        const rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        this.recorder = rec;
        rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) this.chunks.push(e.data); };
        rec.onstop = () => {
          if (this.discard) { this.discard = false; this.stopHardware(); return; }
          this.finishClip(new Blob(this.chunks, { type: rec.mimeType || mime || "audio/webm" }));
        };
        const AC = window.AudioContext || window.webkitAudioContext;
        this.actx = new AC();
        this.an = this.actx.createAnalyser();
        this.an.fftSize = 1024;
        this.buf = new Uint8Array(this.an.frequencyBinCount);
        this.freq = new Uint8Array(this.an.frequencyBinCount);
        this.actx.createMediaStreamSource(stream).connect(this.an);
        rec.start(250);
      } catch {
        this.arming = false;
        this.stopHardware();
        this.setState({ errorCopy: "The microphone is blocked." });
        this.go("err");
        return;
      }
    }
    if (gen !== this.gen) { this.arming = false; return; }
    this.recRef = true;
    this.arming = false;
    this.t0 = performance.now();
    this.setState({ recording: true, left: this.DUR });
    this.raf = requestAnimationFrame(() => this.loop());
  }

  stopRecording() {
    this.recRef = false;
    this.setState({ recording: false });
    if (this.raf) cancelAnimationFrame(this.raf);
    const rec = this.recorder;
    if (!rec || rec.state === "inactive") { this.stopHardware(); this.finishClip(null); return; }
    try { rec.requestData(); } catch {}
    setTimeout(() => { try { if (rec.state !== "inactive") rec.stop(); } catch {} }, 80);
  }

  showResult(data, simulated) {
    const drive = this.mods.map.fromAnalyzer(data, this.state.prompt.e);
    this.setState({ results: data, simulated });
    this.stopping = false;
    this.go(drive.mixed ? "unsure" : "good");
  }

  async finishClip(blob) {
    const target = this.state.prompt.e;
    if (this.simulate) {
      const reqId = ++this.reqId;
      this.go("load");
      setTimeout(() => {
        if (reqId !== this.reqId) return;
        this.showResult(this.mods.line.simulateResult(target), true);
      }, 1100);
      return;
    }
    const reqId = ++this.reqId;
    this.go("load");
    let data;
    try {
      /* Measured on this device (voice/engine.js via blop/local.js), compared with the line's example.
         This replaces the Wav2Vec2 + GAT server (blop/api.js), which this page could never reach.
         Silence, noise and short takes come back as a line for Blop to say, never as a made-up score. */
      const VE = window.VoiceEngine;
      if (!blob || !blob.size) throw new Error("empty take");
      const { pcm, sr } = await this.local.decode(blob);
      const take = VE.analyze(pcm, sr, { minVoiced: this.local.MIN_VOICED });
      const example = await this.exampleFor(this.state.prompt).catch(() => null);
      if (reqId !== this.reqId) return;
      this.lastTake = { pcm, sr };
      data = this.local.toPayload(VE, take, target, example && example.analysis);
    } catch (err) {
      if (reqId !== this.reqId) return;
      console.warn("blop: couldn't measure the take", err);
      data = { unheard: true, copy: !blob || blob.size < 1500 ? this.local.UNHEARD.short : this.local.UNHEARD.none };
    }
    if (data.unheard) {
      this.setState({ errorCopy: data.copy, errRetry: true });
      this.stopping = false;
      this.go("err");
      return;
    }
    const id = this.state.prompt.id;
    this.setState({ tries: { ...this.state.tries, [id]: (this.state.tries[id] || 0) + 1 }, showMelody: false });
    this.showResult(data, false);
  }

  rollPrompt() {
    let next = this.pick();
    for (let i = 0; i < 8 && next.t === this.state.prompt.t; i += 1) next = this.pick();
    this.setState({ prompt: next, showMelody: false });
    this.exampleFor(next).catch(() => undefined);
    return next;
  }

  skipFromRec() {
    if (this.state.view !== "rec") return;
    this.gen += 1;
    this.lastTap = 0;
    this.lastSkip = 0;
    this.stopping = false;
    this.resetRec();
    this.sayExample(this.rollPrompt());
  }

  /* ---------- the example: Blop says the line first, moving with the sound ---------- */
  exampleFor(line) {
    if (!line || !line.id || !this.local || !window.VoiceEngine) return Promise.resolve(null);
    if (!this.examples[line.id]) {
      this.examples[line.id] = this.local.loadExample(line, window.VoiceEngine).then((ex) => {
        this.heard[line.id] = ex;
        setTimeout(() => this.paintGuide(), 0);
        return ex;
      });
      this.examples[line.id].catch(() => { delete this.examples[line.id]; });
    }
    return this.examples[line.id];
  }

  sayExample(line) {
    line = line || this.state.prompt;
    const url = this.local && this.local.exampleUrl(line);
    if (!url) return;
    this.stopExample();
    const audio = new Audio(url);
    this.exampleAudio = audio;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!this.playCtx) this.playCtx = new AC();
      const ctx = this.playCtx;
      if (ctx.state === "suspended") ctx.resume().catch(() => undefined);
      const an = ctx.createAnalyser();
      an.fftSize = 1024;
      ctx.createMediaElementSource(audio).connect(an);
      an.connect(ctx.destination);
      const buf = new Uint8Array(an.frequencyBinCount);
      const tick = () => {
        if (this.exampleAudio !== audio) return;
        an.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i += 1) { const d = (buf[i] - 128) / 128; sum += d * d; }
        this.voice = Math.min(1, Math.sqrt(sum / buf.length) * 4);
        this.sayRaf = requestAnimationFrame(tick);
      };
      this.sayRaf = requestAnimationFrame(tick);
    } catch { /* plays without moving Blop */ }
    const done = () => { if (this.exampleAudio === audio) this.stopExample(); };
    audio.onended = done;
    audio.onerror = done;
    this.setState({ speaking: true });
    audio.play().catch(done);
  }

  stopExample() {
    cancelAnimationFrame(this.sayRaf);
    if (this.exampleAudio) {
      this.exampleAudio.onended = null;
      this.exampleAudio.pause();
      this.exampleAudio = null;
    }
    if (!this.recRef) this.voice = 0;
    if (this.state.speaking) this.setState({ speaking: false });
  }

  playTake() {
    const t = this.lastTake;
    if (!t || !t.pcm || !t.pcm.length) return;
    this.stopExample();
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!this.playCtx) this.playCtx = new AC();
    const ctx = this.playCtx;
    if (ctx.state === "suspended") ctx.resume().catch(() => undefined);
    const buf = ctx.createBuffer(1, t.pcm.length, t.sr);
    buf.getChannelData(0).set(t.pcm);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start();
  }

  paintGuide() {
    const c = this.guide, ex = this.state.prompt && this.heard[this.state.prompt.id];
    if (!c || !c.isConnected || !this.local) return;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    if (!ex) return;
    const pts = this.local.melodyOf(ex.analysis);
    this.local.strokeMelody(ctx, pts, c.width, c.height, "rgba(197,206,216,0.55)", 4, null, this.local.melodyRange(pts));
  }

  paintOverlay() {
    const c = this.overlay, r = this.state.results;
    if (!c || !c.isConnected || !this.local) return;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    if (!r || !r.overlay) return;
    const range = this.local.melodyRange(r.overlay.model, r.overlay.user);   /* one scale, so the two compare */
    this.local.strokeMelody(ctx, r.overlay.model, c.width, c.height, "rgba(197,206,216,0.5)", 3, [9, 7], range);
    this.local.strokeMelody(ctx, r.overlay.user, c.width, c.height, "#e8eef4", 3, null, range);
  }

  enterSimulate() {
    this.simulate = true;
    this.gen += 1;
    this.stopping = false;
    this.lastTap = 0;
    this.lastSkip = 0;
    this.arming = false;
    this.resetRec();
    this.go("rec");
    void this.startRecording();
  }

  onBlop() {
    if (this.handle) this.handle.kick();
    const view = this.state.view;
    if (view === "home") { this.markMet(); this.go("rec"); this.sayExample(this.state.prompt); return; }
    if (view === "rec") {
      if (this.stopping) return;
      if (this.state.speaking) this.stopExample();
      const now = performance.now();
      const justStarted = this.recRef && now - this.t0 < this.SKIP_MS;
      const secondTap = this.lastTap && now - this.lastTap < this.SKIP_MS;
      if ((this.arming || justStarted) && secondTap) { this.lastTap = 0; this.skipFromRec(); return; }
      if (this.recRef || this.state.recording) {
        this.lastTap = 0;
        this.stopping = true;
        this.stopRecording();
        return;
      }
      this.lastTap = now;
      this.startRecording();
      return;
    }
    if (view === "err") {
      if (this.state.errRetry) { this.setState({ errRetry: false }); this.resetRec(); this.go("rec"); return; }
      this.enterSimulate();
      return;
    }
    /* on the board: tap to try the same line again ("new line" sits under the board) */
    this.reqId += 1;
    this.stopping = false;
    this.resetRec();
    this.simulate = false;
    this.setState({ results: null, simulated: false });
    this.go("rec");
  }

  renderVals() {
    const s = this.state;
    const board = s.view === "good" || s.view === "unsure";
    const drive = board && this.mods ? this.mods.map.fromAnalyzer(s.results, s.prompt.e) : null;
    const caption = this.caption();
    /* with an example, the board's bars show how close each part of the take was to it */
    const own = board && s.results && Array.isArray(s.results.bars) ? s.results.bars : null;
    const bars = own
      ? own.map((b) => ({ name: b.name, value: Math.round(b.value * 100), width: Math.round(b.value * 100) + "%" }))
      : drive
        ? drive.bars.map((b) => ({ name: b.name, value: Math.round(b.value * 100), width: Math.round(b.value * 100) + "%" }))
        : [];
    const sub = s.view === "rec"
      ? (s.recording ? "0:" + String(Math.ceil(s.left)).padStart(2, "0") : s.speaking ? "listen…" : "tap to record · double tap for another")
      : board && s.simulated ? "no microphone · simulated read" : board ? "tap blop to try again" : "";
    const hasLine = !!(s.prompt && s.prompt.id);
    const guideOn = (s.tries[s.prompt.id] || 0) < this.GUIDE_TRIES || s.showMelody;

    return {
      notHome: s.view !== "home",
      hasVoices: s.view !== "home" && !!(s.prompt && s.prompt.clip),
      isRec: s.view === "rec",
      isBoard: board,
      isPlain: !board && s.view !== "rec",
      isErr: s.view === "err",
      isMicErr: s.view === "err" && !s.errRetry,
      showGuide: s.view === "rec" && !s.recording && hasLine && guideOn,
      canHear: s.view === "rec" && !s.recording && !s.speaking && hasLine,
      canShowMelody: !guideOn,
      hasOverlay: board && !!(s.results && s.results.overlay),
      hasExample: board && hasLine && !s.simulated,
      hasTake: board && !s.simulated && !!this.lastTake,
      hearExample: () => this.sayExample(this.state.prompt),
      hearTake: () => this.playTake(),
      showMelody: () => this.setState({ showMelody: true }),
      newLine: () => {
        this.reqId += 1;
        this.stopping = false;
        this.resetRec();
        this.simulate = false;
        this.setState({ results: null, simulated: false });
        const next = this.rollPrompt();
        this.go("rec");
        this.sayExample(next);
      },
      guideRef: (el) => { this.guide = el; if (el) setTimeout(() => this.paintGuide(), 0); },
      overlayRef: (el) => { this.overlay = el; if (el) setTimeout(() => this.paintOverlay(), 0); },
      hasSub: sub !== "",
      sub,
      caption,
      toneCue: this.mods ? this.mods.line.toneCue(s.prompt.e) : "",
      score: drive ? drive.score : 0,
      boardCopy: drive ? drive.copy : "",
      bars,
      aria: s.view === "home" ? "Start" : s.view === "rec" ? (s.recording ? "Stop recording" : "Start recording. Double tap for another prompt.") : "Try again",
      onBlop: () => this.onBlop(),
      goHome: () => {
        this.reqId += 1;
        this.gen += 1;
        this.stopping = false;
        this.stopExample();
        this.resetRec();
        this.simulate = false;
        this.setState({ results: null, simulated: false });
        this.go("home");
      },
      onSkipPointer: () => {
        if (this.state.view !== "rec" || this.recRef || this.arming || this.state.recording) return;
        const now = performance.now();
        if (this.lastSkip && now - this.lastSkip < this.SKIP_MS) { this.lastSkip = 0; this.skipFromRec(); return; }
        this.lastSkip = now;
      },
      enterSimulate: () => this.enterSimulate(),
      rideRef: (el) => { this.ride = el; },
      blopRef: (el) => { this.blop = el; },
      capRef: (el) => { this.cap = el; },
    };
  }
}
</script>
</body>
</html>
