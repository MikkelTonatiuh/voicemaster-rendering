<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./voice/engine.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html, body { margin: 0; padding: 0; background: #090b0d; }
  a { color: #c9d0d8; text-underline-offset: 3px; }
  a:hover { color: #e8eef4; }

  /* the result board: motion uses Material 3's curves (emphasized decelerate for things that arrive, standard for the rest) */
  .rb { width: min(27rem, 92vw); display: flex; flex-direction: column; gap: 14px; animation: rb-in 520ms cubic-bezier(0.05, 0.7, 0.1, 1) both; }
  @keyframes rb-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .rb-score { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .rb-num { min-height: 56px; font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -0.04em; color: #f1f5f9; font-variant-numeric: tabular-nums; }
  .rb-note { font-size: 13px; letter-spacing: 0.02em; color: #7b838e; }
  .rb-card { display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 14px; border-radius: 24px; background: #0e1216; border: 1px solid #1a2128; }
  .rb-words { text-align: center; font-size: clamp(22px, 6.4vw, 30px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.4; color: #e8eef4; text-wrap: balance; }
  .rb-heard { margin: 0; text-align: center; font-size: 13px; color: #7b838e; text-wrap: pretty; }
  .rb-pace { margin: -4px 0 0; text-align: center; font-size: 13px; color: #7b838e; }
  .rb-lane { display: block; width: 100%; height: 104px; border-radius: 14px; cursor: pointer; touch-action: none; }
  .rb-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .rb-play { display: grid; place-items: center; width: 54px; height: 54px; padding: 0; border-radius: 50%; border: 1px solid rgba(232, 238, 244, 0.2); background: rgba(232, 238, 244, 0.08); color: #f1f5f9; cursor: pointer; transition: transform 200ms cubic-bezier(0.2, 0, 0, 1), background 200ms cubic-bezier(0.2, 0, 0, 1); }
  .rb-play:hover { background: rgba(232, 238, 244, 0.15); }
  .rb-play:active { transform: scale(0.94); }
  .rb-go::before { content: ""; margin-left: 4px; border-style: solid; border-width: 9px 0 9px 15px; border-color: transparent transparent transparent currentColor; }
  .rb-pause::before { content: ""; width: 5px; height: 18px; margin-right: 10px; border-radius: 2px; background: currentColor; box-shadow: 10px 0 0 currentColor; }
  .rb-seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: #12171c; border: 1px solid #1b2229; }
  .rb-opt { min-width: 88px; height: 40px; padding: 0 16px; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 220ms cubic-bezier(0.2, 0, 0, 1), color 220ms cubic-bezier(0.2, 0, 0, 1); }
  .rb-key { display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; vertical-align: 0.5px; }
  .rb-tip { margin: 2px 0 0; text-align: center; font-size: 19px; font-weight: 500; letter-spacing: -0.015em; color: #c9d0d8; text-wrap: pretty; }
  .rb-actions { display: flex; justify-content: center; gap: 10px; }
  .rb-again, .rb-next { height: 50px; padding: 0 24px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 200ms cubic-bezier(0.2, 0, 0, 1), background 200ms cubic-bezier(0.2, 0, 0, 1), border-color 200ms cubic-bezier(0.2, 0, 0, 1); }
  .rb-again { border: 0; background: #e8eef4; color: #0a0d10; }
  .rb-again:hover { background: #ffffff; }
  .rb-next { border: 1px solid #2a333c; background: transparent; color: #c9d0d8; }
  .rb-next:hover { border-color: #3d4955; color: #ffffff; }
  .rb-again:active, .rb-next:active { transform: scale(0.97); }
  .rb-play:focus-visible, .rb-opt:focus-visible, .rb-again:focus-visible, .rb-next:focus-visible, .rw:focus-visible { outline: 2px solid #9fd5ff; outline-offset: 3px; }

  /* a word of the sentence: dim until the replay reaches it, lit while it is said, underlined by how clear it was */
  .rw { position: relative; display: inline-block; margin: 0 0.18em; padding: 2px 1px; border: 0; background: none; font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; border-radius: 6px; transition: color 240ms cubic-bezier(0.2, 0, 0, 1), opacity 240ms cubic-bezier(0.2, 0, 0, 1), transform 320ms cubic-bezier(0.05, 0.7, 0.1, 1); }
  .rw:disabled { cursor: default; }
  .rw::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 3px; border-radius: 3px; background: var(--u, transparent); transform-origin: left center; transition: transform 420ms cubic-bezier(0.05, 0.7, 0.1, 1); }
  .rw[data-v="mid"]::after { background: repeating-linear-gradient(90deg, var(--u) 0 5px, transparent 5px 8px); height: 2px; }
  .rw[data-s="next"] { opacity: 0.42; }
  .rw[data-s="next"]::after { transform: scaleX(0); }
  .rw[data-s="now"] { color: #ffffff; transform: translateY(-2px) scale(1.05); text-shadow: 0 0 22px rgba(190, 215, 255, 0.45); }
  @media (prefers-reduced-motion: reduce) { .rb { animation: none; } .rw, .rw::after, .rb-play, .rb-opt, .rb-again, .rb-next { transition: none; } .rw[data-s="now"] { transform: none; } .blopbtn, .blopcv { transition: none !important; } }
</style>
</helmet>

<div style="min-height: 100vh; background: #090b0d; color: #c9d0d8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 20px 48px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; box-sizing: border-box">

  <sc-if value="{{ notHome }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ goHome }}" style="position: fixed; top: 18px; left: 20px; margin: 0; z-index: 2; border: 0; background: none; color: #8b939c; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">home</button>
  </sc-if>

  <button type="button" class="blopbtn" onClick="{{ onBlop }}" aria-label="{{ aria }}" style="width: {{ blopSize }}; height: auto; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: width 520ms cubic-bezier(0.05, 0.7, 0.1, 1)">
    <span ref="{{ rideRef }}" style="width: 100%; will-change: transform">
      <canvas class="blopcv" ref="{{ blopRef }}" width="380" height="380" role="img" aria-label="Blop" style="width: {{ blopSize }}; height: {{ blopSize }}; display: block; cursor: pointer; transition: width 520ms cubic-bezier(0.05, 0.7, 0.1, 1), height 520ms cubic-bezier(0.05, 0.7, 0.1, 1)"></canvas>
    </span>
  </button>

  <sc-if value="{{ isBoard }}" hint-placeholder-val="{{ false }}">
    <section class="rb" aria-label="Your result">
      <div class="rb-score">
        <span class="rb-num" ref="{{ scoreRef }}"></span>
        <span class="rb-note">{{ scoreNote }}</span>
      </div>

      <div class="rb-card">
        <div class="rb-words" ref="{{ wordsRef }}" role="group" aria-label="{{ lineText }}"></div>
        <sc-if value="{{ hasHeard }}" hint-placeholder-val="{{ false }}">
          <p class="rb-heard">i heard: {{ heardCopy }}</p>
        </sc-if>
        <sc-if value="{{ hasReplay }}" hint-placeholder-val="{{ false }}">
          <canvas class="rb-lane" ref="{{ laneRef }}" role="img" aria-label="Your melody against the example's"></canvas>
          <sc-if value="{{ hasPace }}" hint-placeholder-val="{{ false }}">
            <p class="rb-pace">{{ paceCopy }}</p>
          </sc-if>
          <div class="rb-bar">
            <sc-if value="{{ notPlaying }}" hint-placeholder-val="{{ true }}">
              <button type="button" class="rb-play rb-go" onClick="{{ onPlay }}" aria-label="{{ playLabel }}"></button>
            </sc-if>
            <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}">
              <button type="button" class="rb-play rb-pause" onClick="{{ onPlay }}" aria-label="{{ playLabel }}"></button>
            </sc-if>
            <div class="rb-seg" role="group" aria-label="Which voice to hear">
              <button type="button" class="rb-opt" aria-pressed="{{ youPressed }}" onClick="{{ pickYou }}" style="background: {{ youBg }}; color: {{ youFg }}"><span class="rb-key" style="background: {{ youDot }}; box-shadow: 0 0 8px {{ youDot }}"></span>you</button>
              <sc-if value="{{ hasExample }}" hint-placeholder-val="{{ true }}">
                <button type="button" class="rb-opt" aria-pressed="{{ exPressed }}" onClick="{{ pickExample }}" style="background: {{ exBg }}; color: {{ exFg }}"><span class="rb-key" style="background: rgba(190, 205, 225, 0.6)"></span>example</button>
              </sc-if>
            </div>
          </div>
        </sc-if>
      </div>

      <p class="rb-tip">{{ boardCopy }}</p>

      <div class="rb-actions">
        <button type="button" class="rb-again" onClick="{{ tryAgain }}">↻ try again</button>
        <button type="button" class="rb-next" onClick="{{ newLine }}">next line →</button>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{ isRec }}" hint-placeholder-val="{{ false }}">
    <div role="button" tabindex="0" aria-label="Tap for another line" title="another line" onClick="{{ onSkipTap }}" style="display: flex; flex-direction: column; align-items: center; max-width: 28rem; cursor: pointer; user-select: none; -webkit-user-select: none">
      <span ref="{{ capRef }}" style="margin: 0; max-width: 28rem; text-align: center; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.35; color: #e8eef4; text-wrap: pretty">{{ caption }}</span>
      <sc-if value="{{ showGuide }}" hint-placeholder-val="{{ false }}">
        <canvas ref="{{ guideRef }}" width="560" height="88" role="img" aria-label="The example's melody" style="width: min(280px, 70vw); height: 44px; margin-top: 14px; display: block"></canvas>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ isPlain }}" hint-placeholder-val="{{ true }}">
    <span ref="{{ capRef }}" style="margin: 0; max-width: 28rem; text-align: center; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.35; color: #e8eef4; text-wrap: pretty">{{ caption }}</span>
  </sc-if>

  <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ false }}">
    <p style="margin: 0; font-size: 13px; letter-spacing: 0.04em; color: #7b838e">{{ sub }}</p>
  </sc-if>

  <sc-if value="{{ isMicErr }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ enterSimulate }}" style="margin-top: 8px; border: 0; background: none; color: #8b939c; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">Continue without a microphone</button>
  </sc-if>

  <sc-if value="{{ hasVoices }}" hint-placeholder-val="{{ false }}">
    <a href="https://github.com/CheyneyComputerScience/CREMA-D" target="_blank" rel="noopener" title="Example voices from CREMA-D (Cao et al., 2014), Open Database License" style="position: fixed; bottom: 18px; left: 20px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5c636c; text-decoration: none" style-hover="color: #e8eef4">voices: crema-d</a>
  </sc-if>

  <a href="index.html" style="position: fixed; bottom: 18px; right: 20px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5c636c; text-decoration: none" style-hover="color: #e8eef4">cv</a>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;takeSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:5,&quot;max&quot;:60,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  get DUR() { return this.props.takeSeconds ?? 30; }
  /* practice lines come from voice/models/lines.json: Blop says each one first from voice/models/<id>.mp3,
     then it's the user's turn. These are the fallback if that file can't be loaded (no example voices) */
  PROMPTS = [
    { t: "Could I have a window seat, please?" },
    { t: "Excuse me, where is the nearest subway station?" },
    { t: "How much does this cost?" },
    { t: "Could you say that again, please?" },
    { t: "I'm looking for the baggage claim." },
    { t: "Is this seat taken?" },
  ];
  GUIDE_TRIES = 2;   /* the example's melody shows for the first two tries of a line, then fades out */

  state = {
    view: "home",
    prompt: { t: "Could I have a window seat, please?" },
    loadPct: null,
    recording: false,
    thinking: false,
    results: null,
    simulated: false,
    errorCopy: "No sound came through",
    errRetry: false,
    intro: true,
    ready: false,
    speaking: false,
    tries: {},
    playing: false,      /* the board is playing a voice */
    rpVoice: "you",      /* which voice the board plays: "you" or "example" */
  };

  /* live values the shader reads every frame — kept off React state on purpose */
  voice = 0;
  tone = 0.4;
  recRef = false;
  arming = false;
  stopping = false;
  gen = 0;
  reqId = 0;
  t0 = 0;
  raf = 0;
  lastTap = 0;
  lastSkip = 0;
  endedAt = 0;         /* when the last take ended */
  SKIP_MS = 420;
  simulate = false;
  mods = null;
  handle = null;
  local = null;
  examples = {};
  heard = {};
  exampleAudio = null;
  playCtx = null;
  sayRaf = 0;
  lastTake = null;
  guide = null;
  clarity = null;
  clarityOn = false;   /* the word model is loaded and can score */
  scoreId = 0;
  said = {};
  turn = null;         /* blop/turn.js: when the take is over */
  spec = null;         /* the word check running on the take so far */
  chunks = [];         /* the take's raw microphone samples */
  tap = null;
  micP = null;
  fbuf = null;
  listenTimer = 0;
  replay = null;       /* what the board replays: { you, ex, T, R } (see buildReplay) */
  exFeat = {};         /* the example's features, kept per line (blop/align.js) */
  rp = { voice: "you", playing: false, at: null, shown: 1, src: null, offset: 0, startedAt: 0, scan: null, count: null, shownScore: null, scanned: false, raf: 0 };
  wordsEl = null;
  laneEl = null;
  scoreEl = null;
  wordEls = [];
  wordState = [];
  paintedFor = null;
  recent = [];         /* the lines shown last, newest at the end (see pick) */
  live = { band: "rest", prev: "rest", k: 0, run: null, cost: 1 };   /* how the take is going so far, for Blop to show (see liveStep) */

  /* A line doesn't come back until most of the others have been shown. The last ones shown are remembered, also
     between visits, so reloading the page doesn't start the same lines over. */
  pick() {
    const all = this.PROMPTS, key = (l) => l.id || l.t;
    const keep = Math.min(all.length - 1, Math.floor(all.length * 0.75));
    const fresh = all.filter((l) => !this.recent.includes(key(l)));
    const pool = fresh.length ? fresh : all;
    const next = pool[Math.floor(Math.random() * pool.length)];
    this.recent = keep > 0 ? [...this.recent.filter((k) => k !== key(next)), key(next)].slice(-keep) : [];
    try { window.localStorage.setItem("blop-recent", JSON.stringify(this.recent)); } catch {}
    return next;
  }

  async componentDidMount() {
    const [line, grade, map, pose, local, clarity, turn, replay, align, lines] = await Promise.all([
      import("./blop/line.js"),
      import("./blop/grade.js"),
      import("./blop/map.js"),
      import("./blop/pose.js"),
      import("./blop/local.js"),
      import("./blop/clarity.js"),
      import("./blop/turn.js"),
      import("./blop/replay.js"),
      import("./blop/align.js"),
      fetch("./voice/models/lines.json").then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ]);
    this.mods = { line, grade, map, pose, clarity, turn, replay, align };
    window.addEventListener("resize", this.onResize);
    document.addEventListener("visibilitychange", this.onHidden);
    this.local = local;
    const usable = Array.isArray(lines) ? lines.filter((l) => l && l.id && l.t) : [];
    if (usable.length) this.PROMPTS = usable.some((l) => l.ai) ? usable.filter((l) => l.ai) : usable;
    let intro = true;
    try { intro = !window.localStorage.getItem("blop-met"); } catch {}
    try {
      const seen = JSON.parse(window.localStorage.getItem("blop-recent") || "[]");
      if (Array.isArray(seen)) this.recent = seen.filter((k) => typeof k === "string");
    } catch {}
    const first = this.pick();
    this.setState({ ready: true, prompt: first, intro });
    this.exampleFor(first).catch(() => undefined);
    if (intro) {
      this.introTimer = setTimeout(() => {
        try { window.localStorage.setItem("blop-met", "1"); } catch {}
        this.setState({ intro: false });
      }, 2400);
    }
    if (this.blop) {
      const { mountBlop } = await import("./blop/mount.js");
      this.handle = mountBlop(this.blop, () => {
        const s = this.state;
        const board = s.view === "good" || s.view === "unsure";
        const drive = board && this.mods ? this.mods.map.fromAnalyzer(s.results) : null;
        return {
          mood: drive ? drive.mood : s.speaking ? "listen" : s.thinking ? "think" : this.mods ? this.mods.pose.mascotMood(s.view, s.results, s.recording) : "idle",
          voice: this.voice,
          tone: this.tone,
          recording: s.recording,
          live: this.live.band,
          band: drive ? drive.band : this.mods ? this.mods.grade.scoreBand(s.view, s.results) : null,
          baseLine: this.caption(),
          allowAsides: s.view === "home",
          ride: this.ride,
          cap: this.cap,
          page: [0.035, 0.04, 0.048],
        };
      });
    }
  }

  componentWillUnmount() {
    clearTimeout(this.introTimer);
    if (this.handle) this.handle.stop();
    if (this.clarity) this.clarity.stop();
    window.removeEventListener("resize", this.onResize);
    document.removeEventListener("visibilitychange", this.onHidden);
    this.rpStop(true);
    clearTimeout(this.listenTimer);
    this.stopExample();
    this.stopHardware();
  }

  /* the board's words are drawn by hand, so they are redrawn when the result changes (the word check arriving) */
  componentDidUpdate() {
    if (this.wordsEl && this.paintedFor !== this.state.results) this.paintBoard();
  }

  onResize = () => { if (this.laneEl) this.paintLane(); };

  /* A hidden tab or a locked phone ends the round: the line stops, a take in progress is dropped and the microphone is
     let go, so nothing records the room meanwhile. Back on the page Blop is home again, and a tap on it says the line. */
  onHidden = () => {
    if (document.hidden && this.state.view === "rec") this.toHome();
  };

  toHome() {
    this.reqId += 1;
    this.gen += 1;
    this.stopping = false;
    this.stopExample();
    this.resetRec();
    this.simulate = false;
    this.setState({ results: null, simulated: false });
    this.go("home");
  }
  setWords = (el) => { this.wordsEl = el; if (!el) this.wordEls = []; else { this.paintedFor = null; setTimeout(() => this.paintBoard(), 0); } };
  setLane = (el) => {
    this.laneEl = el;
    if (el && !el.__bound) { el.__bound = true; el.addEventListener("pointerdown", (e) => this.rpLane(e)); }
    if (el) setTimeout(() => this.paintLane(), 0);
  };
  setScore = (el) => { this.scoreEl = el; };

  caption() {
    const s = this.state;
    if (!this.mods) return "tap me.";
    return this.mods.line.baseLine({
      view: s.view, recording: s.recording, intro: s.intro,
      prompt: s.prompt, results: s.results, errorCopy: s.errorCopy,
      loadNote: s.loadPct != null && s.loadPct < 100 ? "getting my ears ready." : "",
    });
  }

  go(view) { this.setState({ view }); }

  markMet() {
    try { window.localStorage.setItem("blop-met", "1"); } catch {}
    this.setState({ intro: false });
  }

  stopHardware() {
    this.recRef = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.tap) { try { this.tap.stop(); } catch {} this.tap = null; }
    if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }
    if (this.micP) { const p = this.micP; this.micP = null; p.then((s) => s.getTracks().forEach((t) => t.stop()), () => undefined); }
    if (this.actx) { this.actx.close().catch(() => undefined); this.actx = null; this.an = null; this.an2 = null; }
    this.turn = null;
    this.spec = null;
    this.live = { band: "rest", prev: "rest", k: 0, run: null, cost: 1 };
    this.voice = 0;
  }

  resetRec() {
    this.rpStop(true);
    this.arming = false;
    clearTimeout(this.listenTimer);
    this.stopHardware();
    this.chunks = [];
    this.setState({ recording: false, thinking: false });
  }

  /* The mic and the audio context are started inside the tap that starts a round. Our choice: an audio context
     started outside a tap can stay suspended on phones, and asking for the mic now means it is ready when Blop has
     finished the line, so the take can start by itself. */
  warmMic() {
    if (this.simulate || this.stream || this.micP) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!this.actx) this.actx = new AC();
      if (this.actx.state === "suspended") this.actx.resume().catch(() => undefined);
      /* automatic gain control would flatten the loudness the analysis measures */
      const p = navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: false } });
      this.micP = p;
      p.catch(() => { if (this.micP === p) this.micP = null; });
    } catch { /* startRecording asks again and shows the error */ }
  }

  /* when Blop has said the line, the take starts by itself */
  listenSoon() {
    if (this.simulate || this.state.view !== "rec") return;
    const gen = this.gen;
    clearTimeout(this.listenTimer);
    this.listenTimer = setTimeout(() => {
      if (gen === this.gen && this.state.view === "rec" && !this.recRef && !this.arming && !this.stopping) this.startRecording();
    }, 250);
  }

  /* the level of the last 21 ms of sound in dB, and whether the last 43 ms were voiced (a pitch: voice/engine.js) */
  listenNow() {
    const x = this.fbuf, n = 1024;
    this.an2.getFloatTimeDomainData(x);
    let sum = 0;
    for (let i = x.length - n; i < x.length; i += 1) sum += x[i] * x[i];
    return { db: 20 * Math.log10(Math.sqrt(sum / n) + 1e-9), voiced: window.VoiceEngine.livePitch(x, this.actx.sampleRate) > 0 };
  }

  loop() {
    if (!this.recRef) return;
    const el = (performance.now() - this.t0) / 1000;
    if (this.an && this.buf) {
      this.an.getByteTimeDomainData(this.buf);
      let sum = 0;
      for (let i = 0; i < this.buf.length; i += 1) { const d = (this.buf[i] - 128) / 128; sum += d * d; }
      this.voice = Math.min(1, Math.sqrt(sum / this.buf.length) * 4);
      if (this.freq) {
        this.an.getByteFrequencyData(this.freq);
        let lo = 0, hi = 0;
        const mid = Math.floor(this.freq.length / 2);
        for (let i = 0; i < mid; i += 1) lo += this.freq[i];
        for (let i = mid; i < this.freq.length; i += 1) hi += this.freq[i];
        this.tone = hi / (lo + hi + 1);
      }
    } else if (this.mods) {
      this.voice = this.mods.grade.simulatedVoice(el);
      this.tone = this.mods.grade.simulatedTone(el);
    }
    if (this.turn && this.an2) {
      /* the take ends when the learner has most likely said all of it (blop/turn.js) */
      try {
        const now = this.listenNow();
        const r = this.turn.tick(el, now.db, now.voiced);
        if (r.done) { this.stopRecording(); return; }
        const pending = this.turn.state().pending;
        if (pending !== this.state.thinking) this.setState({ thinking: pending });
        if (this.turn.wantsPeek()) this.peek();
        else this.liveStep();
      } catch (err) {
        /* a take must still end: from here it is the tap or the time limit */
        console.warn("blop: can't tell when the take is over", err);
        this.turn = null;
      }
    }
    /* the time limit counts from the first speech, so a slow start doesn't eat into a long line */
    const spoke = this.turn ? this.turn.state().t0 : null;
    if (el - (spoke === null ? 0 : spoke) >= this.DUR) { this.stopRecording(); return; }
    this.raf = requestAnimationFrame(() => this.loop());
  }

  /* Whisper hears at most 30 s. A take longer than that is cut to start just before the first speech (turn.js knows
     when that was), which makes room for 30 s of speaking. Shorter takes are scored as they are. */
  forWords(pcm, sr, from) {
    if (!pcm || pcm.length <= sr * 29.5 || !(from > 0)) return pcm;
    /* only what doesn't fit is cut, and never past 0.3 s before the first speech */
    const start = Math.max(0, Math.min(from - 0.3, pcm.length / sr - 29.5));
    return pcm.subarray(Math.floor(start * sr));
  }

  async startRecording() {
    if (this.recRef || this.arming || this.stopping) return;
    this.stopExample();
    const gen = ++this.gen;
    this.arming = true;
    this.chunks = [];
    if (!this.simulate) {
      try {
        /* the warm mic from the tap. If the line changes while this waits, the new round has its own warm mic and
           owns `arming`: this take lets go of its own stream and leaves the rest alone. */
        const asked = this.micP || navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: false } });
        const stream = await asked;
        if (this.micP === asked) this.micP = null;
        if (gen !== this.gen) { stream.getTracks().forEach((t) => t.stop()); return; }
        this.stream = stream;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!this.actx) this.actx = new AC();
        if (this.actx.state === "suspended") this.actx.resume().catch(() => undefined);
        const source = this.actx.createMediaStreamSource(stream);
        this.an = this.actx.createAnalyser();
        this.an.fftSize = 1024;
        this.buf = new Uint8Array(this.an.frequencyBinCount);
        this.freq = new Uint8Array(this.an.frequencyBinCount);
        source.connect(this.an);
        /* what decides when the take is over looks at the last 43 ms: long enough to hear a pitch in */
        this.an2 = this.actx.createAnalyser();
        this.an2.fftSize = 2048;
        this.fbuf = new Float32Array(2048);
        source.connect(this.an2);
        const tap = await window.VoiceEngine.capture(this.actx, source, (c) => { this.chunks.push(c); });
        if (gen !== this.gen) { tap.stop(); stream.getTracks().forEach((t) => t.stop()); return; }
        this.tap = tap;
      } catch {
        if (gen !== this.gen) return;
        this.arming = false;
        this.stopHardware();
        this.setState({ errorCopy: "The microphone is blocked." });
        this.go("err");
        return;
      }
    }
    if (gen !== this.gen) { this.arming = false; return; }
    this.recRef = true;
    this.arming = false;
    this.t0 = performance.now();
    this.spec = null;
    this.live = { band: "rest", prev: "rest", k: 0, run: null, cost: 1 };
    this.turn = null;
    if (!this.simulate && this.mods) {
      /* the model voice is a recording, so how long the line takes is known */
      const ex = this.heard[this.state.prompt.id];
      const span = this.mods.turn.speechSpan(ex && ex.analysis) || this.mods.turn.guessSpan(this.state.prompt.t);
      this.turn = this.mods.turn.createTurn({ expected: span, listens: this.clarityOn });
    }
    this.setState({ recording: true, thinking: false });
    this.raf = requestAnimationFrame(() => this.loop());
    if (!this.simulate) this.prepareClarity();
  }

  /* The word check is a 40 MB model that the browser keeps after the first time. It starts loading at the tap that
     starts a round, so it is usually ready by the time the learner speaks. Resolves true when it can score. */
  prepareClarity() {
    if (!this.clarity && this.mods && this.mods.clarity) {
      try {
        const c = this.mods.clarity.startClarity({
          onProgress: (pct) => { if (pct !== this.state.loadPct) this.setState({ loadPct: pct }); },
        });
        c.onHeard((id, text) => this.onHeard(id, text));
        c.ready.then(
          () => {
            if (this.clarity !== c) return;
            this.clarityOn = true;
            if (this.turn) this.turn.listens(true);
            if (this.state.loadPct != null) this.setState({ loadPct: null });
          },
          (err) => {
            console.warn("blop: the word check could not start", err);
            if (this.clarity === c) { this.clarity = null; this.clarityOn = false; }
            c.stop();
            this.setState({ loadPct: null });
          },
        );
        this.clarity = c;
      } catch { this.clarity = null; }
    }
    return this.clarity ? this.clarity.ready.then(() => true, () => false) : Promise.resolve(false);
  }

  /* While the learner speaks, the word check scores the first words of the line that have surely been said by now
     (blop/clarity.js, wordsReached), and Blop shows how they went (blop/grade.js, liveBand): the same scoring as the
     result, on less of the line. One such scoring runs at a time, and none starts when it could still be running as the
     learner reaches the end of the line, so it doesn't hold up the scoring that ends the take. */
  liveStep() {
    const c = this.clarity, turn = this.turn, live = this.live;
    if (live.run || !turn || !c || !this.clarityOn || !this.actx || !this.mods) return;
    try {
      const st = turn.state();
      const line = this.state.prompt, words = (line.t || "").split(/\s+/).filter(Boolean);
      if (!st.speaking || st.over || !Array.isArray(line.words) || line.words.length !== words.length) return;
      const last = line.words.length - 1, exSpan = line.words[last][1] - line.words[0][0];
      if (st.spoken + live.cost > exSpan) return;
      const k = Math.min(last, this.mods.clarity.wordsReached(line.words, st.spoken));
      if (k < this.mods.clarity.LIVE.min || k <= live.k) return;
      const VE = window.VoiceEngine;
      const job = { id: 0, k };
      live.run = job;
      const sr = this.actx.sampleRate;
      const run = c.score(this.local.wordAudio(VE, this.forWords(VE.join(this.chunks), sr, st.t0), sr), words.slice(0, k).join(" "), { heard: false });
      job.id = run.id;
      run.then(
        (res) => {
          if (this.live !== live || live.run !== job) return;
          live.run = null;
          if (!res.words) return;
          live.k = k;
          live.cost = Math.min(3, Math.max(0.3, res.ms / 1000));
          const read = this.mods.grade.liveBand(res.words);
          live.band = this.mods.grade.showLive(live.band, live.prev, read);
          if (read !== "rest") live.prev = read;
        },
        () => { if (this.live === live && live.run === job) live.run = null; },
      );
    } catch (err) {
      live.run = null;
      console.warn("blop: can't tell how the take is going so far", err);
    }
  }

  /* The learner has gone quiet: the take so far is scored, and a good score on the line's last words means they
     are done. If nobody speaks meanwhile, that scoring is the result, so the answer costs no extra wait. */
  peek() {
    const turn = this.turn, c = this.clarity;
    if (!turn) return;
    if (!c || !this.clarityOn || !this.actx) { turn.listens(false); return; }
    if (this.live.run && this.live.run.id) c.cancel(this.live.run.id);
    const VE = window.VoiceEngine;
    const at = turn.peeking();
    const pcm = VE.join(this.chunks), sr = this.actx.sampleRate, text = this.state.prompt.t;
    if (this.spec && !this.spec.result) c.cancel(this.spec.run.id);
    const job = { at, result: null, run: null };
    this.spec = job;
    try {
      job.run = c.score(this.local.wordAudio(VE, this.forWords(pcm, sr, turn.state().t0), sr), text, { heard: false });
    } catch (err) {
      console.warn("blop: the word check couldn't score the take so far", err);
      this.spec = null;
      turn.listens(false);
      return;
    }
    job.run.then(
      (res) => {
        if (this.spec !== job || !this.turn) return;
        if (!res.words) { this.turn.listens(false); return; }
        job.result = res;
        this.turn.heard(at, this.mods.clarity.tailHeard(res.words));
      },
      () => { if (this.spec === job && this.turn) this.turn.listens(false); },
    );
  }

  /* the word scores for a take, or null when the word check isn't available (offline, or the model didn't load).
     spec is the scoring done while the learner was quiet, when nothing was said after it; from is when the speech
     began (see forWords). */
  async measureClarity(pcm, sr, text, reqId, spec, from) {
    if (!text) return null;
    /* a stalled download shouldn't keep the user waiting: after 90 s the board shows the comparison alone */
    const ready = await Promise.race([this.prepareClarity(), new Promise((res) => setTimeout(() => res(false), 90000))]);
    if (!ready || reqId !== this.reqId) return null;
    try {
      const VE = window.VoiceEngine;
      if (spec) {
        const res = spec.result || await Promise.race([spec.run, new Promise((res2) => setTimeout(() => res2(null), 45000))]);
        if (res && res.words) {
          this.scoreId = res.id;
          this.clarity.hear(res.id, this.local.wordAudio(VE, this.forWords(pcm, sr, from), sr));
          return res;
        }
      }
      const audio = this.local.wordAudio(VE, this.forWords(pcm, sr, from), sr);
      const res = await Promise.race([
        this.clarity.score(audio, text),
        new Promise((_, no) => setTimeout(() => no(new Error("the word check took too long")), 45000)),
      ]);
      this.scoreId = res.id;
      return res.words ? res : null;
    } catch (err) {
      console.warn("blop: the word check failed", err);
      return null;
    }
  }

  /* what the model made of the take arrives after the words do */
  onHeard(id, text) {
    this.said[id] = text;
    const r = this.state.results;
    if (id === this.scoreId && r && !r.heard) this.setState({ results: { ...r, heard: text } });
  }

  stopRecording() {
    this.recRef = false;
    this.stopping = true;
    this.setState({ recording: false, thinking: false });
    if (this.raf) cancelAnimationFrame(this.raf);
    const pcm = this.actx && this.chunks.length ? window.VoiceEngine.join(this.chunks) : null;
    const sr = this.actx ? this.actx.sampleRate : 0;
    const st = this.turn ? this.turn.state() : null;
    const tl = st ? st.tl : null;
    const spec = this.spec && tl !== null && this.spec.at === tl ? this.spec : null;
    if (this.live.run && this.live.run.id && this.clarity) this.clarity.cancel(this.live.run.id);
    this.endedAt = performance.now();
    this.stopHardware();
    this.finishTake(pcm, sr, spec, st ? st.t0 : null);
  }

  showResult(data, simulated) {
    const drive = this.mods.map.fromAnalyzer(data);
    /* a tap queued behind the work that brought the board up still counts as late (see onBlop) */
    this.endedAt = Math.max(this.endedAt, performance.now());
    this.setState({ results: data, simulated });
    this.stopping = false;
    this.go(drive.mixed ? "unsure" : "good");
  }

  async finishTake(pcm, sr, spec, from) {
    if (this.simulate) {
      const reqId = ++this.reqId;
      this.go("load");
      setTimeout(() => {
        if (reqId !== this.reqId) return;
        this.replay = null;
        this.showResult(this.mods.line.simulateResult(this.state.prompt.t), true);
      }, 1100);
      return;
    }
    const reqId = ++this.reqId;
    this.go("load");
    let data, later = null, took = null, heardEx = null;
    try {
      /* Measured on this device: which words were clear (blop/clarity.js), and how the melody, timing and pauses
         compare with the line's example (voice/engine.js via blop/local.js). If the word check can't run, the
         board shows the comparison alone. Silence, noise and short takes come back as a line for Blop to say,
         never as a made-up score. */
      const VE = window.VoiceEngine;
      if (!pcm || pcm.length < sr * 0.3) throw new Error("empty take");
      const take = VE.analyze(pcm, sr, { minVoiced: this.local.MIN_VOICED });
      if (take.ok) {
        const example = await this.exampleFor(this.state.prompt).catch(() => null);
        if (reqId !== this.reqId) return;
        this.lastTake = { pcm, sr };
        took = take;
        heardEx = example;
        /* With the word model ready, its scoring is part of the result. If it is still downloading (the first
           visit, about 40 MB), the board comes up at once with the comparison and the words follow. A line with no
           example has nothing to compare with, so its board waits for the words. */
        const canCompare = !!(example && example.analysis && example.analysis.ok);
        const ready = this.clarityOn || !!spec || !canCompare;
        const clarity = ready ? await this.measureClarity(pcm, sr, this.state.prompt.t, reqId, spec, from) : null;
        if (reqId !== this.reqId) return;
        data = this.local.toPayload(VE, take, example && example.analysis, clarity);
        if (clarity && this.said[clarity.id]) data.heard = this.said[clarity.id];
        if (!ready && this.clarity) { data.pending = true; data.notice = ""; later = { take, example }; }
      } else {
        data = this.local.toPayload(VE, take);
      }
    } catch (err) {
      if (reqId !== this.reqId) return;
      console.warn("blop: couldn't measure the take", err);
      data = { unheard: true, copy: !pcm || pcm.length < sr * 0.5 ? this.local.UNHEARD.short : this.local.UNHEARD.none };
    }
    if (data.unheard) {
      this.setState({ errorCopy: data.copy, errRetry: true });
      this.stopping = false;
      this.go("err");
      return;
    }
    const id = this.state.prompt.id;
    this.setState({ tries: { ...this.state.tries, [id]: (this.state.tries[id] || 0) + 1 } });
    try { this.replay = took && took.ok ? this.buildReplay(took, pcm, sr, heardEx) : null; } catch (err) { console.warn("blop: couldn't build the replay", err); this.replay = null; }
    this.showResult(data, false);
    if (later) this.addWords(pcm, sr, later.take, later.example, reqId, from);
  }

  /* the first visit: the board is up and the model is still arriving; when it has, the words are added */
  async addWords(pcm, sr, take, example, reqId, from) {
    const clarity = await this.measureClarity(pcm, sr, this.state.prompt.t, reqId, null, from);
    if (reqId !== this.reqId) return;
    const r = this.state.results;
    if (!r || !r.pending) return;
    const data = this.local.toPayload(window.VoiceEngine, take, example && example.analysis, clarity);
    if (clarity && this.said[clarity.id]) data.heard = this.said[clarity.id];
    this.setState({ results: data });
  }

  rollPrompt() {
    const next = this.pick();
    this.setState({ prompt: next });
    this.exampleFor(next).catch(() => undefined);
    return next;
  }

  /* another line, at any point in a round: before Blop has said it, while it does, or while the take is running */
  skipFromRec() {
    if (this.state.view !== "rec") return;
    this.gen += 1;
    this.lastTap = 0;
    this.lastSkip = performance.now();
    this.stopping = false;
    this.resetRec();
    this.warmMic();
    this.sayExample(this.rollPrompt());
  }

  /* ---------- the example: Blop says the line first, moving with the sound ---------- */
  exampleFor(line) {
    if (!line || !line.id || !this.local || !window.VoiceEngine) return Promise.resolve(null);
    if (!this.examples[line.id]) {
      this.examples[line.id] = this.local.loadExample(line, window.VoiceEngine).then((ex) => {
        this.heard[line.id] = ex;
        setTimeout(() => this.paintGuide(), 0);
        return ex;
      });
      this.examples[line.id].catch(() => { delete this.examples[line.id]; });
    }
    return this.examples[line.id];
  }

  sayExample(line) {
    line = line || this.state.prompt;
    const url = this.local && this.local.exampleUrl(line);
    /* a line without an example (the built-in ones): the take starts by itself all the same */
    if (!url) { this.listenSoon(); return; }
    this.stopExample();
    const audio = new Audio(url);
    this.exampleAudio = audio;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!this.playCtx) this.playCtx = new AC();
      const ctx = this.playCtx;
      if (ctx.state === "suspended") ctx.resume().catch(() => undefined);
      const an = ctx.createAnalyser();
      an.fftSize = 1024;
      ctx.createMediaElementSource(audio).connect(an);
      an.connect(ctx.destination);
      const buf = new Uint8Array(an.frequencyBinCount);
      const tick = () => {
        if (this.exampleAudio !== audio) return;
        an.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i += 1) { const d = (buf[i] - 128) / 128; sum += d * d; }
        this.voice = Math.min(1, Math.sqrt(sum / buf.length) * 4);
        this.sayRaf = requestAnimationFrame(tick);
      };
      this.sayRaf = requestAnimationFrame(tick);
    } catch { /* plays without moving Blop */ }
    /* when Blop has finished, it is the learner's turn: the take starts by itself */
    const done = () => { if (this.exampleAudio === audio) { this.stopExample(); this.listenSoon(); } };
    audio.onended = done;
    audio.onerror = done;
    this.setState({ speaking: true });
    audio.play().catch(done);
  }

  stopExample() {
    clearTimeout(this.listenTimer);
    cancelAnimationFrame(this.sayRaf);
    if (this.exampleAudio) {
      this.exampleAudio.onended = null;
      this.exampleAudio.pause();
      this.exampleAudio = null;
    }
    if (!this.recRef) this.voice = 0;
    if (this.state.speaking) this.setState({ speaking: false });
  }

  /* ---------- the replay on the result board ---------- */

  /* how long you took against the example, when it differs enough to matter */
  paceCopy() {
    const rep = this.replay;
    if (!rep || !rep.ex || !(rep.ex.dur > 0)) return "";
    const r = rep.you.dur / rep.ex.dur;
    if (r >= 1.25) return "you took " + r.toFixed(1) + "× as long as the example";
    if (r <= 0.8) return "you were " + (1 / r).toFixed(1) + "× quicker than the example";
    return "";
  }

  calm() {
    try { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch { return false; }
  }

  /* what the board replays: the take and the example as audio, where each word is said in each, and the melody of each.
     The example's words are known exactly (voice/models/lines.json); the take's are found by lining it up with the
     example (blop/align.js), or from its syllables when there is no example. */
  buildReplay(take, pcm, sr, example) {
    const VE = window.VoiceEngine, R = this.mods.replay, A = this.mods.align;
    const line = this.state.prompt;
    const words = line.t.split(/\s+/).filter(Boolean);
    if (!words.length) return null;
    const anchors = Array.isArray(line.words) && line.words.length === words.length ? line.words : null;
    const exOk = !!(example && example.pcm && example.analysis && example.analysis.ok);
    let ex = null, exSpans = null, run = null;
    if (exOk) {
      /* the example's speech starts and ends where the analysis sees it, the way a take's does, so the two begin together */
      const sp0 = R.speechRuns(example.analysis);
      if (sp0.to > sp0.from) run = { from: sp0.from, to: sp0.to };
      exSpans = anchors ? A.exampleSpans(anchors, run && run.from, run && run.to) : R.wordSpans(words, example.analysis, null).map((s) => [s.from, s.to]);
      const a = exSpans[0][0], b = exSpans[exSpans.length - 1][1];
      ex = { pcm: example.pcm, sr: example.sr, t0: a, dur: Math.max(0.2, b - a), spans: exSpans.map((s, i) => ({ w: words[i], from: s[0] - a, to: s[1] - a })), contour: R.contour(example.analysis, a, b) };
    }
    let spans;
    if (anchors && exOk) {
      if (!this.exFeat[line.id]) this.exFeat[line.id] = A.features(VE.resample(example.pcm, example.sr, 16000), Math.max(0, exSpans[0][0] - 0.05), exSpans[exSpans.length - 1][1] + 0.05);
      spans = A.takeSpans(words, { anchors, feat: this.exFeat[line.id], run }, { pcm: VE.resample(pcm, sr, 16000), analysis: take });
    } else spans = R.wordSpans(words, take, null);
    const a = spans[0].from, b = Math.max(spans[spans.length - 1].to, a + 0.2);
    const you = { pcm, sr, t0: a, dur: b - a, spans: spans.map((s) => ({ w: s.w, from: s.from - a, to: s.to - a })), contour: R.contour(take, a, b) };
    /* The lane is drawn in the example's seconds: your take is passed through a word-by-word map, so each word sits
       under the same word of the example however fast or slow you said it, and both lines begin together. Your own
       seconds are kept for playing and for the word lights. */
    const map = ex ? R.wordMap(you.spans, ex.spans) : null;
    you.fwd = map ? map.fwd : (t) => t;
    you.inv = map ? map.inv : (t) => t;
    you.lane = R.warpContour(you.contour, you.fwd);
    you.laneSpans = you.spans.map((s) => ({ w: s.w, from: you.fwd(s.from), to: you.fwd(s.to) }));
    return { you, ex, T: Math.max(you.lane ? you.lane.dur : you.dur, ex ? ex.dur : 0) + 0.12, R: R.laneReach(you.contour, ex && ex.contour) };
  }

  /* the sentence as one button per word, so any word can be played on its own */
  paintBoard() {
    this.paintedFor = this.state.results;
    const box = this.wordsEl, r = this.state.results;
    if (!box || !r || !this.mods) return;
    const rgb = (level) => "rgb(" + this.mods.grade.TINTS[level].map((v) => Math.round(v * 255)).join(",") + ")";
    const words = (this.state.prompt.t || "").split(/\s+/).filter(Boolean);
    box.textContent = "";
    this.wordEls = words.map((w, i) => {
      const b = document.createElement("button");
      const level = r.words && r.words[i] ? r.words[i].level : "none";
      b.type = "button";
      b.className = "rw";
      b.textContent = w;
      b.dataset.v = level;
      b.dataset.s = "idle";
      b.disabled = !this.replay;
      b.setAttribute("aria-label", w + (level === "bad" ? ", was hard to hear" : level === "mid" ? ", was a bit soft" : "") + (this.replay ? ". play it" : ""));
      if (level === "mid" || level === "bad") b.style.setProperty("--u", rgb(level));
      b.addEventListener("click", () => this.rpWord(i));
      box.appendChild(b);
      return b;
    });
    this.wordState = words.map(() => "idle");
    this.paintLane();
    this.paintScore();
    /* the first time this result is shown: a silent run over the sentence, lighting the words and drawing your melody */
    const rp = this.rp;
    if (this.replay && !rp.scanned) {
      rp.scanned = true;
      rp.voice = "you";
      if (this.state.rpVoice !== "you") this.setState({ rpVoice: "you" });
      rp.scan = { t0: performance.now(), dur: Math.min(2000, Math.max(1100, this.replay.you.dur * 650)) };
      rp.shown = 0;
      rp.at = 0;
      this.rpLoop();
    }
  }

  paintScore() {
    const el = this.scoreEl, r = this.state.results, rp = this.rp;
    if (!el || !r || !this.mods) return;
    const to = Math.round(this.mods.map.fromAnalyzer(r).score);
    if (rp.shownScore === null && !this.calm()) {
      rp.count = { from: 0, to, t0: performance.now(), dur: 800 };
      rp.shownScore = 0;
      el.textContent = "0";
      this.rpLoop();
    } else if (!rp.count) {
      rp.shownScore = to;
      el.textContent = String(to);
    } else rp.count.to = to;
  }

  paintLane() {
    const c = this.laneEl, rep = this.replay, rp = this.rp;
    if (!c || !rep || !this.mods || !this.state.results) return;
    const W = c.clientWidth || 340, H = c.clientHeight || 104, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const voice = rp.voice === "example" && rep.ex ? "example" : "you";
    const band = this.mods.map.fromAnalyzer(this.state.results).band;
    const tint = (this.mods.grade.TINTS[band] || this.mods.grade.TINTS.good).map((v) => Math.round(v * 255));
    const at = rp.at === null || rp.at === undefined ? null : voice === "you" ? rep.you.fwd(rp.at) : rp.at;
    this.mods.replay.paintLane(ctx, W, H, { you: rep.you.lane, ex: rep.ex ? rep.ex.contour : null, T: rep.T, R: rep.R, voice, at, shown: rp.shown, tint, spans: voice === "example" ? rep.ex.spans : rep.you.laneSpans });
  }

  /* each word is dim until the replay reaches it, lit while it is said, and underlined once it has been passed */
  paintWordStates() {
    const rp = this.rp, rep = this.replay;
    if (!rep || !this.wordEls.length) return;
    const spans = (rp.voice === "example" && rep.ex ? rep.ex : rep.you).spans;
    const cur = rp.at === null ? -1 : this.mods.replay.wordAt(spans, rp.at);
    this.wordEls.forEach((el, i) => {
      let s = "idle";
      if (rp.at !== null && spans[i]) s = i === cur ? "now" : spans[i].to <= rp.at ? "done" : "next";
      if (this.wordState[i] !== s) { this.wordState[i] = s; el.dataset.s = s; }
    });
  }

  rpFrame() {
    const rp = this.rp, rep = this.replay, now = performance.now();
    if (rp.count && this.scoreEl) {
      const u = Math.min(1, (now - rp.count.t0) / rp.count.dur);
      this.scoreEl.textContent = String(Math.round(rp.count.from + (rp.count.to - rp.count.from) * this.mods.replay.EASE.emphasized(u)));
      if (u >= 1) { rp.shownScore = rp.count.to; rp.count = null; }
    }
    if (rep) {
      const v = rp.voice === "example" && rep.ex ? rep.ex : rep.you;
      if (rp.playing && rp.src && this.playCtx) rp.at = Math.min(v.dur, rp.offset + (this.playCtx.currentTime - rp.startedAt));
      else if (rp.scan) {
        const u = Math.min(1, (now - rp.scan.t0) / rp.scan.dur);
        rp.shown = this.mods.replay.EASE.standard(u);
        rp.at = rep.you.inv(rp.shown * rep.you.lane.dur);   /* the reveal runs across the lane; the playhead is where your take is at that point */
        if (u >= 1) { rp.scan = null; rp.shown = 1; rp.at = null; }
      }
      this.paintWordStates();
      this.paintLane();
    }
  }

  rpLoop() {
    const rp = this.rp;
    if (rp.raf) return;
    const step = () => {
      rp.raf = 0;
      this.rpFrame();
      if (rp.playing || rp.scan || rp.count) rp.raf = requestAnimationFrame(step);
    };
    rp.raf = requestAnimationFrame(step);
  }

  /* play a voice from a moment, up to another if given; the words and the melody follow it */
  rpPlay(voice, from = 0, until = null) {
    const rep = this.replay;
    if (!rep) return;
    const which = voice === "example" && rep.ex ? "example" : "you";
    const v = which === "example" ? rep.ex : rep.you, rp = this.rp;
    this.rpStop(false);
    this.stopExample();
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!this.playCtx) this.playCtx = new AC();
    const ctx = this.playCtx;
    if (ctx.state === "suspended") ctx.resume().catch(() => undefined);
    const buf = ctx.createBuffer(1, v.pcm.length, v.sr);
    buf.getChannelData(0).set(v.pcm);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    const t = Math.min(Math.max(0, from), v.dur);
    rp.voice = which;
    rp.src = src;
    rp.playing = true;
    rp.offset = t;
    rp.startedAt = ctx.currentTime;
    rp.at = t;
    rp.shown = 1;
    src.onended = () => { if (rp.src === src) { rp.src = null; this.rpDone(); } };
    src.start(0, Math.max(0, v.t0 + t), until === null ? v.dur - t + 0.25 : Math.max(0.05, until - t));
    this.setState({ playing: true, rpVoice: which });
    this.rpLoop();
  }

  rpDone() {
    const rp = this.rp;
    rp.playing = false;
    rp.at = null;
    this.setState({ playing: false });
    this.rpFrame();
  }

  /* stop playing; with clear, also forget the replay (a new round has begun) */
  rpStop(clear) {
    const rp = this.rp;
    if (rp.src) { try { rp.src.onended = null; rp.src.stop(); } catch { /* already stopped */ } rp.src = null; }
    if (rp.raf) { cancelAnimationFrame(rp.raf); rp.raf = 0; }
    const was = rp.playing;
    rp.playing = false;
    rp.scan = null;
    rp.at = null;
    rp.shown = 1;
    if (clear) { rp.count = null; rp.shownScore = null; rp.scanned = false; rp.voice = "you"; this.replay = null; this.paintedFor = null; }
    if (was || (clear && (this.state.playing || this.state.rpVoice !== "you"))) this.setState({ playing: false, rpVoice: clear ? "you" : this.state.rpVoice });
    if (!clear && this.replay) { this.paintWordStates(); this.paintLane(); }
  }

  rpToggle() {
    if (this.rp.playing) this.rpStop(false);
    else this.rpPlay(this.rp.voice, 0);
  }

  /* choosing a voice plays it */
  rpPick(voice) { this.rpPlay(voice, 0); }

  rpWord(i) {
    const rep = this.replay;
    if (!rep) return;
    const v = this.rp.voice === "example" && rep.ex ? rep.ex : rep.you, s = v.spans[i];
    if (s) this.rpPlay(this.rp.voice, Math.max(0, s.from - 0.06), s.to + 0.1);
  }

  /* a tap on the melody plays from there */
  rpLane(e) {
    const rep = this.replay, c = this.laneEl;
    if (!rep || !c) return;
    const box = c.getBoundingClientRect();
    const t = ((e.clientX - box.left - 8) / Math.max(1, box.width - 16)) * rep.T;
    const v = this.rp.voice === "example" && rep.ex ? rep.ex : rep.you;
    const own = v === rep.you ? rep.you.inv(t) : t;   /* the lane is in the example's seconds: a take's own are found back from them */
    if (own >= -0.1 && own <= v.dur + 0.1) this.rpPlay(this.rp.voice, Math.max(0, own));
  }

  /* try the same line again: Blop says it first */
  retry() {
    this.reqId += 1;
    this.stopping = false;
    this.resetRec();
    this.simulate = false;
    this.setState({ results: null, simulated: false });
    this.go("rec");
    this.warmMic();
    this.sayExample(this.state.prompt);
  }

  paintGuide() {
    const c = this.guide, ex = this.state.prompt && this.heard[this.state.prompt.id];
    if (!c || !c.isConnected || !this.local) return;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    if (!ex) return;
    const pts = this.local.melodyOf(ex.analysis);
    this.local.strokeMelody(ctx, pts, c.width, c.height, "rgba(197,206,216,0.55)", 4, null, this.local.melodyRange(pts));
  }

  enterSimulate() {
    this.simulate = true;
    this.gen += 1;
    this.stopping = false;
    this.lastTap = 0;
    this.lastSkip = 0;
    this.arming = false;
    this.resetRec();
    this.go("rec");
    void this.startRecording();
  }

  onBlop() {
    if (this.handle) this.handle.kick();
    const view = this.state.view;
    if (view === "home") {
      if (!this.local) return;   /* the page is still loading */
      this.markMet(); this.warmMic(); this.prepareClarity(); this.go("rec"); this.sayExample(this.state.prompt);
      return;
    }
    /* the take is being measured: a tap just after it ended was meant to end it; a later one tries again */
    if (view === "load" && performance.now() - this.endedAt < 800) return;
    if (view === "rec") {
      if (this.stopping) return;
      if (this.state.speaking) this.stopExample();
      const now = performance.now();
      const justStarted = this.recRef && now - this.t0 < this.SKIP_MS;
      const secondTap = this.lastTap && now - this.lastTap < this.SKIP_MS;
      if ((this.arming || justStarted) && secondTap) { this.lastTap = 0; this.skipFromRec(); return; }
      if (this.recRef || this.state.recording) {
        this.lastTap = 0;
        this.stopping = true;
        this.stopRecording();
        return;
      }
      this.lastTap = now;
      this.startRecording();
      return;
    }
    if (view === "err") {
      if (this.state.errRetry) { this.setState({ errRetry: false }); this.resetRec(); this.go("rec"); this.warmMic(); this.sayExample(this.state.prompt); return; }
      this.enterSimulate();
      return;
    }
    /* on the board: a tap on Blop tries the same line again, as the button does. Not right after a take that ended by
       itself, though: that tap was meant to end it. */
    if (performance.now() - this.endedAt < 800) return;
    this.retry();
  }

  renderVals() {
    const s = this.state;
    const board = s.view === "good" || s.view === "unsure";
    const drive = board && this.mods ? this.mods.map.fromAnalyzer(s.results) : null;
    const caption = this.caption();
    const words = board && s.results && Array.isArray(s.results.words) ? s.results.words : null;
    const sub = s.view === "load" ? (s.loadPct != null && s.loadPct < 100 ? "first time only · " + s.loadPct + "%" : "")
      : board && s.simulated ? "no microphone · simulated read"
      : board && s.results && s.results.pending ? "word check on its way" + (s.loadPct != null && s.loadPct < 100 ? " · first time only · " + s.loadPct + "%" : "")
      : board && s.results && s.results.notice ? s.results.notice
      : "";
    const hasLine = !!(s.prompt && s.prompt.id);
    const guideOn = (s.tries[s.prompt.id] || 0) < this.GUIDE_TRIES;
    const you = s.rpVoice !== "example";

    return {
      notHome: s.view !== "home",
      hasVoices: s.view !== "home" && !!(s.prompt && s.prompt.clip),
      isRec: s.view === "rec",
      isBoard: board,
      isPlain: !board && s.view !== "rec",
      isErr: s.view === "err",
      isMicErr: s.view === "err" && !s.errRetry,
      showGuide: s.view === "rec" && hasLine && guideOn,
      blopSize: board ? "min(232px, 58vw)" : "min(380px, 86vw)",
      hasReplay: board && !!this.replay,
      hasExample: board && !!(this.replay && this.replay.ex),
      hasPace: board && this.paceCopy() !== "",
      paceCopy: this.paceCopy(),
      playing: !!s.playing,
      notPlaying: !s.playing,
      playLabel: s.playing ? "Pause" : you ? "Play your take" : "Play the example",
      youPressed: you ? "true" : "false",
      exPressed: you ? "false" : "true",
      youDot: board && s.results && this.mods ? "rgb(" + (this.mods.grade.TINTS[this.mods.map.fromAnalyzer(s.results).band] || this.mods.grade.TINTS.good).map((v) => Math.round(v * 255)).join(",") + ")" : "#e8eef4",
      youBg: you ? "#26303a" : "transparent",
      youFg: you ? "#f1f5f9" : "#8b939c",
      exBg: you ? "transparent" : "#26303a",
      exFg: you ? "#8b939c" : "#f1f5f9",
      onPlay: () => this.rpToggle(),
      pickYou: () => this.rpPick("you"),
      pickExample: () => this.rpPick("example"),
      tryAgain: () => this.retry(),
      newLine: () => {
        this.reqId += 1;
        this.stopping = false;
        this.resetRec();
        this.simulate = false;
        this.setState({ results: null, simulated: false });
        const next = this.rollPrompt();
        this.go("rec");
        this.warmMic();
        this.sayExample(next);
      },
      guideRef: (el) => { this.guide = el; if (el) setTimeout(() => this.paintGuide(), 0); },
      wordsRef: this.setWords,
      laneRef: this.setLane,
      scoreRef: this.setScore,
      lineText: s.prompt.t || "",
      /* without the word check (still on its way on a first visit, or unavailable) the number is the melody and timing comparison */
      scoreNote: words ? (s.results.wordsNote || "") : board && s.results && !s.simulated ? (s.results.pending ? "melody and timing so far" : "melody and timing") : "",
      hasSub: sub !== "",
      sub,
      caption,
      hasHeard: !!(words && s.results.heard && words.some((x) => x.level !== "ok")),
      heardCopy: words && s.results.heard ? s.results.heard.toLowerCase() : "",
      boardCopy: drive ? drive.copy : "",
      aria: s.view === "home" ? "Start" : s.view === "rec" ? (s.recording ? "Stop recording" : "Start recording. Double tap for another prompt.") : s.view === "load" ? "Checking your take. Tap to try again" : "Try again",
      onBlop: () => this.onBlop(),
      goHome: () => this.toHome(),
      onSkipTap: () => {
        /* one tap on the sentence gives another line, whatever Blop or the mic is doing; a double tap is one change */
        if (this.state.view !== "rec" || this.stopping) return;
        if (performance.now() - this.lastSkip < 2 * this.SKIP_MS) return;
        this.skipFromRec();
      },
      enterSimulate: () => this.enterSimulate(),
      rideRef: (el) => { this.ride = el; },
      blopRef: (el) => { this.blop = el; },
      capRef: (el) => { this.cap = el; },
    };
  }
}
</script>
</body>
</html>
