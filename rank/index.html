<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemma 4 rank · Mikkel T. Chávez Petersen</title>
<style>
  /* The CV's own ink, ground and amber, in both themes. */
  :root { --bg: #000; --ink: #DEDAD0; --ink-2: #9C988F; --warm: #FFB13D; --line: rgba(222, 218, 208, 0.14); }
  @media (prefers-color-scheme: light) { :root { --bg: #F3F1EB; --ink: #2A2721; --ink-2: #5B5750; --warm: #8F4A00; --line: rgba(42, 39, 33, 0.14); } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 56px 20px; }
  a { color: inherit; }
  .label { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--warm); }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .meta { margin: 0 0 22px; font-size: 13px; color: var(--ink-2); }
  .big { font-size: 15px; margin: 0 0 18px; }
  .big b { color: var(--warm); font-size: 28px; font-weight: 700; margin-right: 6px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 7px 10px; border-top: 1px solid var(--line); }
  td:first-child { width: 3.5em; color: var(--ink-2); }
  td:last-child { text-align: right; color: var(--ink-2); }
  tr.me td { background: color-mix(in srgb, var(--warm) 15%, transparent); color: var(--warm); font-weight: 600; border-top-color: transparent; }
  tr.me td:first-child { border-radius: 6px 0 0 6px; } tr.me td:last-child { border-radius: 0 6px 6px 0; }
  .foot { margin-top: 22px; font-size: 13px; color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <p class="label">Competition · Kaggle</p>
  <h1>The Gemma 4 Developer Agent Competition</h1>
  <p class="meta">Hosted by Google DeepMind · public leaderboard, read from Kaggle every 4 hours</p>
  <p class="big" id="big">Loading…</p>
  <table id="lb"></table>
  <p class="foot"><a href="https://www.kaggle.com/competitions/gemma-4-developer-agent/leaderboard">Full leaderboard on Kaggle ↗</a> · <a href="../">Back to the CV</a></p>
</main>
<script>
  fetch("../rank.json", { cache: "no-store" }).then((r) => r.json()).then((d) => {
    const ord = (n) => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
    document.getElementById("big").innerHTML = "<b>" + ord(d.gemma) + "</b>" + (d.total ? "of " + d.total.toLocaleString("en") + " teams" : "place");
    const lb = document.getElementById("lb");
    for (const r of d.near || []) {
      const tr = lb.insertRow();
      if (r.team === d.team) tr.className = "me";
      for (const v of [r.rank, r.team, r.score]) tr.insertCell().textContent = v;
    }
    if (!(d.near || []).length) lb.insertRow().insertCell().textContent = "Nearby teams appear after the next update.";
  }).catch(() => { document.getElementById("big").textContent = "The rank could not be loaded."; });
</script>
</body>
</html>
